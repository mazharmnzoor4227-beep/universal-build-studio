name: Build Media Pocket
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['media-pocket/**', '.github/workflows/build-media-pocket.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Test and build
        working-directory: media-pocket
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Package source
        run: zip -r media-pocket-source.zip media-pocket -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: media-pocket
          path: |
            media-pocket/app/build/outputs/apk/debug/app-debug.apk
            media-pocket-source.zip
      - name: Publish APK and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cp media-pocket/app/build/outputs/apk/debug/app-debug.apk media-pocket.apk
          gh release create "media-pocket-$GITHUB_RUN_NUMBER" media-pocket.apk media-pocket-source.zip --target "$SHA" --title "Media Pocket test build $GITHUB_RUN_NUMBER" --notes "Android 10+ ARM64. Debug-signed test build. Public video links use yt-dlp; photos require public structured image metadata. Source and license notices included. No guarantee of every platform/link or watermark-free source. Device runtime validation pending." --latest=false
