name: Build NEXORA AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nexora/**'
      - '.github/workflows/build-nexora.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble NEXORA debug APK
        working-directory: nexora
        run: gradle :app:assembleDebug

      - name: Package source
        run: zip -r nexora-source.zip nexora -x '*/build/*' '*/.gradle/*'

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-${{ github.run_number }}
          path: |
            nexora/app/build/outputs/apk/debug/app-debug.apk
            nexora-source.zip
          retention-days: 14

      - name: Create preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp nexora/app/build/outputs/apk/debug/app-debug.apk nexora-ai.apk
          gh release create "nexora-${GITHUB_RUN_NUMBER}" nexora-ai.apk nexora-source.zip \
            --target "$GITHUB_SHA" \
            --title "NEXORA AI preview ${GITHUB_RUN_NUMBER}" \
            --notes "Debug preview. Add your own provider key inside the app; no key is packaged in this APK." \
            --latest=false
