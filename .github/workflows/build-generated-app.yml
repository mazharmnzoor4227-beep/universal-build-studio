name: Build Generated App
run-name: Build ${{ inputs.request_id || 'legacy' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique builder request ID (empty for legacy app)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: generated-${{ inputs.request_id || 'legacy' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Download inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUEST_ID" && ! "$REQUEST_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "Invalid request ID"; exit 1
          fi
          TAG="universal-builder-input"
          if [[ -n "$REQUEST_ID" ]]; then TAG="builder-$REQUEST_ID"; fi
          mkdir -p generated-project output
          gh release download "$TAG" --pattern project-input.zip --dir generated-project
          gh release download "$TAG" --pattern build-meta.json --dir generated-project
          gh release download "$TAG" --pattern app-icon.png --dir generated-project || true
      - name: Validate and extract project
        run: python3 scripts/prepare-project.py generated-project/project-input.zip generated-project/source
      - name: Install Flutter
        if: env.PROJECT_TYPE == 'FLUTTER'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'FLUTTER'
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [[ ! -d android ]]; then
            echo "Include the complete Flutter Android project, including android/"; exit 1
          fi
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/output/generated-app.apk"
      - name: Build Android APK
        if: env.PROJECT_TYPE == 'ANDROID'
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [[ -f gradlew ]]; then chmod +x gradlew; ./gradlew assembleDebug --stacktrace
          else gradle assembleDebug --stacktrace; fi
          mapfile -t APKS < <(find . -path '*/build/outputs/apk/*' -name '*.apk' ! -name '*androidTest*' ! -name '*unaligned*')
          if [[ "${#APKS[@]}" != 1 ]]; then
            echo "Expected one debug APK; use a single application module/variant. Found ${#APKS[@]}"; exit 1
          fi
          cp "${APKS[0]}" "$GITHUB_WORKSPACE/output/generated-app.apk"
      - name: Build Web APK
        if: env.PROJECT_TYPE == 'WEB' || env.PROJECT_TYPE == 'NODE_WEB'
        run: bash scripts/build-web-apk.sh "$PROJECT_ROOT" "$GITHUB_WORKSPACE/output" "$GITHUB_WORKSPACE/generated-project/app-icon.png" "$GITHUB_WORKSPACE/generated-project/build-meta.json"
      - name: Godot unsupported
        if: env.PROJECT_TYPE == 'GODOT'
        run: |
          echo "Godot Android export is not implemented; upload a supported complete project."
          exit 1
      - name: Verify APK structure
        run: |
          test -s output/generated-app.apk
          unzip -t output/generated-app.apk >/dev/null
          unzip -l output/generated-app.apk | grep AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: output/generated-app.apk
          retention-days: 1
          if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check release signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No release key configured: output keeps its project/debug signature.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with: {name: generated-apk, path: unsigned}
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with: {distribution: temurin, java-version: '17'}
      - name: Sign and verify APK in isolated job
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          mkdir signed
          "$TOOLS/zipalign" -p -f 4 unsigned/generated-app.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out signed/generated-app.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify signed/generated-app.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: generated-apk
          path: signed/generated-app.apk
          overwrite: true
          retention-days: 1
  cleanup:
    needs: build
    if: always() && inputs.request_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove this request's input assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$REQUEST_ID" =~ ^[a-f0-9-]{36}$ ]] || exit 1
          gh release delete "builder-$REQUEST_ID" --yes --cleanup-tag
